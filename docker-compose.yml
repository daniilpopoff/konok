services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: konok
      POSTGRES_PASSWORD: konok
      POSTGRES_DB: konok
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konok"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://konok:konok@db:5432/konok
      TEST_DATABASE_URL: postgresql+psycopg://konok:konok@db:5432/konok_test
      MEDIA_DIR: /data/media
    volumes:
      - media:/data/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src   # правки в коде сразу видны в браузере
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
